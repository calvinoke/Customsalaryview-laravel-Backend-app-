jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Blue–Green Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR=/home/ec2-user/apps/laravel-app
            cd $APP_DIR

            echo "🚀 Starting Blue–Green deployment"

            # Detect active color
            ACTIVE_COLOR=$(cat active_color.txt 2>/dev/null || echo blue)
            if [ "$ACTIVE_COLOR" = "blue" ]; then
              NEW_COLOR=green
            else
              NEW_COLOR=blue
            fi

            echo "🔵 Active: $ACTIVE_COLOR → 🟢 New: $NEW_COLOR"

            git pull origin main

            echo "🧾 Writing .env..."
            cat <<EOF > .env
APP_ENV=production
APP_DEBUG=false
APP_KEY=${{ secrets.PROD_APP_KEY }}
APP_URL=${{ secrets.PROD_APP_URL }}

DB_CONNECTION=mysql
DB_HOST=${{ secrets.PROD_DB_HOST }}
DB_PORT=3306
DB_DATABASE=${{ secrets.PROD_DB_NAME }}
DB_USERNAME=${{ secrets.PROD_DB_USER }}
DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
EOF

            echo "🐳 Building $NEW_COLOR stack..."
            docker compose -f docker-compose.$NEW_COLOR.yml up -d --build

            echo "🧪 Running migrations..."
            docker exec laravel_app_$NEW_COLOR php artisan migrate --force

            echo "❤️ Health check..."
            for i in {1..10}; do
              if curl -sf http://localhost/health; then
                echo "✅ App healthy"
                break
              fi
              sleep 3
            done

            if ! curl -sf http://localhost/health; then
              echo "❌ Health check failed → rollback"
              docker compose -f docker-compose.$NEW_COLOR.yml down
              exit 1
            fi

            echo "🔁 Switching traffic to $NEW_COLOR"
            sed -i "s/laravel_app_$ACTIVE_COLOR/laravel_app_$NEW_COLOR/g" docker/nginx/upstream.conf
            docker exec laravel_nginx nginx -s reload

            echo "$NEW_COLOR" > active_color.txt

            echo "🧹 Stopping old stack..."
            docker compose -f docker-compose.$ACTIVE_COLOR.yml down

            echo "🎉 Deployment complete"

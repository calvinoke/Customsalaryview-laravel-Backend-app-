version: "3.8"  # optional, can remove as it's deprecated

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - .:/var/www
    env_file:
      - .env   # Laravel reads DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD
    depends_on:
      - mysql
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/certbot:/var/www/certbot
      - ./docker/letsencrypt:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8
    container_name: laravel_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret            # must match DB_PASSWORD in .env
      MYSQL_DATABASE: laravel                # must match DB_DATABASE in .env
      MYSQL_USER: laravel                    # must match DB_USERNAME in .env
      MYSQL_PASSWORD: secret                 # must match DB_PASSWORD in .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

  certbot:
    image: certbot/certbot
    volumes:
      - ./docker/certbot:/var/www/certbot
      - ./docker/letsencrypt:/etc/letsencrypt
    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel:
    driver: bridge

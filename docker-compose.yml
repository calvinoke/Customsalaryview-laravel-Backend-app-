version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - .:/var/www
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/certbot:/var/www/certbot
      - ./docker/letsencrypt:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8
    container_name: laravel_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}  # matches workflow
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

  certbot:
    image: certbot/certbot
    volumes:
      - ./docker/certbot:/var/www/certbot
      - ./docker/letsencrypt:/etc/letsencrypt
    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel:
    driver: bridge

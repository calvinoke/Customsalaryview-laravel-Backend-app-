version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - .:/var/www
    env_file:
      - .env   # <-- reads the same .env created by GitHub Actions
    depends_on:
      - mysql
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/certbot:/var/www/certbot
      - ./docker/letsencrypt:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8
    container_name: laravel_mysql
    restart: unless-stopped
    env_file:
      - .env   # <-- reads DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD from .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

  certbot:
    image: certbot/certbot
    volumes:
      - ./docker/certbot:/var/www/certbot
      - ./docker/letsencrypt:/etc/letsencrypt
    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel:
    driver: bridge
